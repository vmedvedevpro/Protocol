<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protocol</title>
    <!--
      Sets the page's color-scheme from the saved theme before the bundle runs,
      so a dark window never flashes white; AppThemeProvider takes over once it
      mounts. Keep the key and the values in step with src/styles/themeMode.ts.
      Tauri's CSP admits this script by its hash. Put no <style> element here:
      Tauri gives it a nonce, and a nonce in style-src switches off the
      'unsafe-inline' that styled-components needs for its runtime styles.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('meetily_theme');
          var dark = saved === 'dark' || saved === 'midnight' || saved === 'charcoal' ||
            (saved !== 'light' && saved !== 'vanilla' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (_) {
          // No storage: the page follows the OS theme.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
