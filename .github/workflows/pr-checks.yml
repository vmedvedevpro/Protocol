name: PR frontend checks
on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs the same checks before it builds anything.
  workflow_call:
permissions:
  contents: read
concurrency:
  # Called from release.yml, github.workflow names the caller; keep its own group.
  group: frontend-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # Windows and macOS resolve imports without regard to case, so two
      # modules whose paths differ only in case (ReleaseNotes.tsx beside
      # releaseNotes.ts) break their builds while Linux, which runs these
      # checks, builds fine.
      - name: No module paths that differ only in case
        working-directory: .
        run: |
          clashes=$(git ls-files | awk '{ k = tolower($0); sub(/\.(d\.ts|tsx|ts|jsx|js|mjs|cjs)$/, "", k); if (k in seen) print seen[k] " / " $0; else seen[k] = $0 }')
          if [ -n "$clashes" ]; then echo "$clashes"; exit 1; fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      # tsc -b, then vite build into frontend/out.
      - run: pnpm run build
      - run: pnpm run build-storybook

  release-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test the release helper scripts
        run: node --test "scripts/release/test/*.test.mjs"
      # Recomputes both platform columns from the git blobs, so an edited or
      # unpinned migration fails at review time, long before a release build.
      - name: Check released migration checksums
        run: node scripts/release/check-migration-checksums.mjs --source git
      # Installed apps read model-catalog/catalog.json from main, so a broken
      # entry must not merge; the app applies the same rules when it reads it.
      - name: Test the model catalog checker
        run: node --test "scripts/model-catalog/test/*.test.mjs"
      - name: Check the model catalog
        run: node scripts/model-catalog/check-catalog.mjs model-catalog/catalog.json
      # A tester sends the app's log with a bug report, so no log line may
      # print meeting content or secrets (#234).
      - name: Test the log line checker
        run: node --test "scripts/log-audit/test/*.test.mjs"
      - name: Check the log lines
        run: node scripts/log-audit/check-log-lines.mjs
