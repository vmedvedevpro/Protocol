name: PR frontend checks
on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs the same checks before it builds anything.
  workflow_call:
permissions:
  contents: read
concurrency:
  # Called from release.yml, github.workflow names the caller; keep its own group.
  group: frontend-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run frontend tests in isolated processes
        run: pnpm dlx bun@1.3.10 scripts/test-isolated.mjs
      - run: pnpm run build
      - run: pnpm exec tsc --noEmit

  release-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test the release helper scripts
        run: node --test "scripts/release/test/*.test.mjs"
      # Recomputes both platform columns from the git blobs, so an edited or
      # unpinned migration fails at review time, long before a release build.
      - name: Check released migration checksums
        run: node scripts/release/check-migration-checksums.mjs --source git
