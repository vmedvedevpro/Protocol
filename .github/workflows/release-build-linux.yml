name: Release build (Linux)

# Called by release.yml. Builds the experimental x86_64 AppImage and deb,
# checks that the AppImage starts, and uploads the release-linux artifact.
# No secrets, read-only token. The native tests have never run on Linux in
# this lineage and do not block a release yet.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux:
    # 22.04: the oldest supported glibc, so the AppImage and deb run on more systems.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      NEXT_TELEMETRY_DISABLED: '1'
      PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: 'false'
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out with Unix line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Check the version and the migrations this build embeds
        run: |
          node scripts/release/check-version-files.mjs "$VERSION"
          node scripts/release/check-migration-checksums.mjs --source worktree --platform unix
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libx11-dev libxtst-dev libxrandr-dev libdbus-1-dev libssl-dev pkg-config \
            libclang-dev libfuse2 squashfs-tools xvfb file
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: '. -> target'
          key: linux-x86_64-release-v1
      - name: Build llama-helper
        run: |
          cargo build --release --locked -p llama-helper
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # See release-build-macos.yml: with #31's updater configuration tauri
      # build signs the AppImage and needs a key; release.yml signs it again.
      - name: Build the AppImage and the deb
        working-directory: frontend
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/build.key"
          node node_modules/@tauri-apps/cli/tauri.js signer generate --ci -w "$key"
          TAURI_SIGNING_PRIVATE_KEY="$key" pnpm exec tauri build --ci --bundles appimage,deb -- --locked
      # The bundled libwayland-client crashes WebKitGTK's EGL setup on some
      # Wayland desktops (upstream's workaround, kept). Repacked with the
      # AppImage's own runtime and squashfs-tools from the distribution, before
      # anything checksums or signs the file.
      - name: Remove libwayland-client from the AppImage
        run: |
          set -euo pipefail
          appimage=$(realpath "$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)")
          work="$RUNNER_TEMP/appimage"
          mkdir -p "$work"
          chmod +x "$appimage"
          offset=$("$appimage" --appimage-offset)
          (cd "$work" && "$appimage" --appimage-extract >/dev/null)
          mapfile -t libraries < <(find "$work/squashfs-root" -name 'libwayland-client.so*')
          if (( ${#libraries[@]} == 0 )); then
            echo "No libwayland-client in the AppImage"
            exit 0
          fi
          printf 'Removing %s\n' "${libraries[@]}"
          rm -f "${libraries[@]}"
          compression=$(unsquashfs -s -o "$offset" "$appimage" | awk '$1 == "Compression" { print $2 }')
          head -c "$offset" "$appimage" > "$work/runtime"
          mksquashfs "$work/squashfs-root" "$work/filesystem.squashfs" -root-owned -noappend -comp "$compression" -quiet
          cat "$work/runtime" "$work/filesystem.squashfs" > "$appimage"
          chmod +x "$appimage"
          rm -rf "$work"
      - name: Test the native code (not blocking yet)
        continue-on-error: true
        run: cargo test --release --locked -p protocol --lib -- --test-threads=1
      - name: Check the packages and start the AppImage
        run: |
          set -euo pipefail
          appimage=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          deb=$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$appimage" && test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E ' \./usr/bin/protocol$'
          dpkg-deb --contents "$deb" | grep -q 'resources/diarization/THIRD_PARTY_MODELS.txt'
          if dpkg-deb --contents "$deb" | grep -Eq 'runtime-deps|installer-variants'; then
            echo "The deb carries the Windows resource folders"
            exit 1
          fi

          log="$RUNNER_TEMP/protocol-launch.log"
          # Own session, so stopping it also stops Xvfb and the app's children.
          APPIMAGE_EXTRACT_AND_RUN=1 RUST_BACKTRACE=1 RUST_LOG=info setsid xvfb-run -a "$appimage" >"$log" 2>&1 &
          pid=$!
          sleep 30
          if ! kill -0 "$pid" >/dev/null 2>&1; then
            wait "$pid" || true
            cat "$log"
            echo "Protocol exited during startup."
            exit 1
          fi
          kill -TERM -- "-$pid" >/dev/null 2>&1 || true
          sleep 2
          kill -KILL -- "-$pid" >/dev/null 2>&1 || true
          wait "$pid" >/dev/null 2>&1 || true
          cat "$log"
          grep -q "Application setup complete" "$log"
          if ! grep -q "Fresh database initialized successfully" "$log"; then
            echo "::warning::The Linux WebView did not reach the database setup under xvfb"
          fi

          mkdir -p dist
          cp "$appimage" dist/protocol-linux-x86_64.AppImage
          cp "$deb" "dist/protocol_${VERSION}_amd64.deb"
          node scripts/release/write-sha256sums.mjs dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: |
            dist/protocol-linux-x86_64.AppImage
            dist/protocol_${{ inputs.version }}_amd64.deb
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: logs-linux
          path: ${{ runner.temp }}/protocol-launch.log
          if-no-files-found: ignore
          retention-days: 14
