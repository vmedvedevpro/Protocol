name: Release build (Linux)

# Called by release.yml. Builds the x86_64 AppImage and deb,
# checks that the AppImage starts, and uploads the leg-linux artifact.
# No secrets, read-only token. The native tests have never run on Linux in
# this lineage and do not block a release yet.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux:
    # 22.04: the oldest supported glibc, so the AppImage and deb run on more systems.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      NEXT_TELEMETRY_DISABLED: '1'
      PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: 'false'
      VERSION: ${{ inputs.version }}
      # ggml's CPU code for a stated baseline, not for the runner's CPU (#176).
      # ggml defaults to GGML_NATIVE=ON (-march=native); a runner with AVX-512
      # put AVX-512 into the 1.0.0 RC, and Whisper died with SIGILL at every
      # model load on CPUs without it (most Intel client CPUs since Alder
      # Lake). whisper-rs-sys passes GGML_* variables to ggml's CMake. The
      # baseline is x86-64-v3: AVX2, FMA, F16C and BMI2, which Intel Core CPUs
      # have since Haswell (2013) and AMD since Excavator (2015). CPUs without
      # AVX2 are not supported (the release notes say so). Keep it the same as
      # build-universal-windows.ps1 and updater-e2e.yml. llama-helper needs
      # none of it: llama-cpp-sys-2 sets GGML_NATIVE=OFF itself (it only passes
      # CMAKE_* on), and ggml's defaults then are this baseline.
      # whisper-rs-sys does not rebuild when these change: bump the
      # rust-cache key below with them.
      GGML_NATIVE: 'OFF'
      GGML_SSE42: 'ON'
      GGML_AVX: 'ON'
      GGML_AVX2: 'ON'
      GGML_FMA: 'ON'
      GGML_F16C: 'ON'
      GGML_BMI2: 'ON'
      GGML_AVX512: 'OFF'
    steps:
      - name: Check out with Unix line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Check the version and the migrations this build embeds
        run: |
          node scripts/release/check-version-files.mjs "$VERSION"
          node scripts/release/check-migration-checksums.mjs --source worktree --platform unix
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libx11-dev libxtst-dev libxrandr-dev libdbus-1-dev libssl-dev pkg-config \
            libclang-dev libfuse2 squashfs-tools xvfb file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-alsa
      # Whisper on Vulkan (#176): ggml-vulkan needs the Vulkan headers and glslc
      # to build, the SDK Windows builds with (release-build-windows.yml), not
      # Ubuntu 22.04's 1.3.204 headers. -lvulkan links against the SDK's loader
      # (LIBRARY_PATH); neither the executable nor the test binary keeps a
      # libvulkan.so.1 dependency (whisper_engine/vulkan.rs). The runner has no
      # Vulkan driver: the app and the tests run Whisper on the CPU.
      - name: Set up the Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: false
      - name: Link against the SDK's Vulkan loader
        run: echo "LIBRARY_PATH=$VULKAN_SDK/lib" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: '. -> target'
          key: linux-x86_64-release-v2
      - name: Build llama-helper
        run: |
          cargo build --release --locked -p llama-helper
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
      # The read-only MCP server Settings > AI agents points agents at (#8).
      - name: Build protocol-mcp
        run: |
          cargo build --release --locked -p protocol-mcp
          cp target/release/protocol-mcp frontend/src-tauri/binaries/protocol-mcp-x86_64-unknown-linux-gnu
      # WebKitGTK plays recordings through GStreamer, and the AppImage's AppRun
      # lets GStreamer load plugins from the image only: without them
      # WebKitWebProcess aborts when a meeting opens. bundleMediaFramework
      # (tauri.linux.conf.json) copies GSTREAMER_PLUGINS_DIR into the
      # AppImage; this directory holds only the player's plugins
      # (scripts/release/appimage-gstreamer.mjs). The deb uses the system's.
      - name: Stage the AppImage's GStreamer plugins
        run: node scripts/release/appimage-gstreamer.mjs stage /usr/lib/x86_64-linux-gnu/gstreamer-1.0 "$RUNNER_TEMP/gstreamer-plugins"
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # See release-build-macos.yml: with #31's updater configuration tauri
      # build signs the AppImage and needs a key; release.yml signs it again.
      # The deb is a build of its own (#100). Tauri installs every externalBin
      # entry as /usr/bin/<name>, and /usr/bin/ffmpeg belongs to the
      # distribution's ffmpeg package, so tauri.deb.conf.json leaves the pinned
      # ffmpeg out and depends on that package; /usr/bin/protocol finds it next
      # to itself. The config is compiled into the binary, so the second build
      # recompiles the protocol crate, not its dependencies. The AppImage keeps
      # the pinned ffmpeg and is built last from the plain config, as before.
      - name: Build the deb and the AppImage
        working-directory: frontend
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/build.key"
          node node_modules/@tauri-apps/cli/tauri.js signer generate --ci -w "$key"
          TAURI_SIGNING_PRIVATE_KEY="$key" pnpm exec tauri build --ci --bundles deb --features vulkan --config src-tauri/tauri.deb.conf.json -- --locked
          GSTREAMER_PLUGINS_DIR="$RUNNER_TEMP/gstreamer-plugins" TAURI_SIGNING_PRIVATE_KEY="$key" pnpm exec tauri build --ci --bundles appimage --features vulkan -- --locked
      # The bundled libwayland-client crashes WebKitGTK's EGL setup on some
      # Wayland desktops (upstream's workaround, kept). Repacked with the
      # AppImage's own runtime and squashfs-tools from the distribution, before
      # anything checksums or signs the file.
      - name: Remove libwayland-client from the AppImage
        run: |
          set -euo pipefail
          appimage=$(realpath "$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)")
          work="$RUNNER_TEMP/appimage"
          mkdir -p "$work"
          chmod +x "$appimage"
          offset=$("$appimage" --appimage-offset)
          (cd "$work" && "$appimage" --appimage-extract >/dev/null)
          mapfile -t libraries < <(find "$work/squashfs-root" -name 'libwayland-client.so*')
          if (( ${#libraries[@]} == 0 )); then
            echo "No libwayland-client in the AppImage"
            exit 0
          fi
          printf 'Removing %s\n' "${libraries[@]}"
          rm -f "${libraries[@]}"
          compression=$(unsquashfs -s -o "$offset" "$appimage" | awk '$1 == "Compression" { print $2 }')
          head -c "$offset" "$appimage" > "$work/runtime"
          mksquashfs "$work/squashfs-root" "$work/filesystem.squashfs" -root-owned -noappend -comp "$compression" -quiet
          cat "$work/runtime" "$work/filesystem.squashfs" > "$appimage"
          chmod +x "$appimage"
          rm -rf "$work"
      # The GGML_* baseline above reached the shipped executables: no AVX-512
      # (no EVEX instruction at all) in the deb's or the AppImage's protocol and
      # llama-helper (scripts/release/check-cpu-baseline.mjs). Each package
      # build relinks protocol, so both copies are checked.
      - name: Check that the executables need no AVX-512
        run: |
          set -euo pipefail
          appimage=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          deb=$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          work="$RUNNER_TEMP/cpu-baseline"
          mkdir -p "$work"
          dpkg-deb -x "$deb" "$work/deb"
          unsquashfs -no-progress -o "$("$appimage" --appimage-offset)" -d "$work/appimage" "$appimage" usr/bin/protocol usr/bin/llama-helper >/dev/null
          node scripts/release/check-cpu-baseline.mjs --no-evex \
            "$work/deb/usr/bin/protocol" "$work/deb/usr/bin/llama-helper" \
            "$work/appimage/usr/bin/protocol" "$work/appimage/usr/bin/llama-helper"
          rm -rf "$work"
      # custom-protocol as in tauri build, so tauri and its dependents are not
      # compiled again for the tests.
      - name: Test the native code (not blocking yet)
        continue-on-error: true
        run: cargo test --release --locked -p protocol --lib --features custom-protocol,vulkan -- --test-threads=1
      - name: Test protocol-mcp
        run: cargo test --release --locked -p protocol-mcp -p meeting-library
      - name: Check the packages and start the AppImage
        run: |
          set -euo pipefail
          appimage=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          deb=$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$appimage" && test -n "$deb"
          dpkg-deb --info "$deb"
          contents="$RUNNER_TEMP/deb-contents.txt"
          dpkg-deb --contents "$deb" | tee "$contents"
          # tauri-bundler writes the data archive without the usual ./ prefix.
          grep -Eq ' (\./)?usr/bin/protocol$' "$contents"
          grep -Eq ' (\./)?usr/bin/protocol-mcp$' "$contents"
          # The deb takes ffmpeg from the distribution (#100).
          if grep -Eq ' (\./)?usr/bin/ffmpeg$' "$contents"; then
            echo "The deb carries its own ffmpeg, which collides with the distribution's ffmpeg package"
            exit 1
          fi
          depends=$(dpkg-deb --field "$deb" Depends)
          if [[ ", $depends," != *", ffmpeg,"* ]]; then
            echo "The deb does not depend on ffmpeg: $depends"
            exit 1
          fi
          if grep -Eq 'runtime-deps|installer-variants' "$contents"; then
            echo "The deb carries the Windows resource folders"
            exit 1
          fi
          # Whisper on Vulkan (#176): the app opens the system's loader itself
          # and starts without it, so the executable must not link it, and
          # the deb brings the loader for the GPU.
          if [[ ", $depends," != *", libvulkan1,"* ]]; then
            echo "The deb does not depend on libvulkan1: $depends"
            exit 1
          fi
          if readelf -d target/release/protocol | grep -q 'libvulkan'; then
            readelf -d target/release/protocol
            echo "protocol links libvulkan.so.1 and would not start without a Vulkan loader"
            exit 1
          fi
          # The minibar's layer-shell on Wayland (#199): the app opens
          # gtk-layer-shell itself and starts without it, so the executable
          # must not link it, and the deb recommends it.
          recommends=$(dpkg-deb --field "$deb" Recommends)
          if [[ ", $recommends," != *", libgtk-layer-shell0,"* ]]; then
            echo "The deb does not recommend libgtk-layer-shell0: $recommends"
            exit 1
          fi
          if readelf -d target/release/protocol | grep -q 'libgtk-layer-shell'; then
            readelf -d target/release/protocol
            echo "protocol links libgtk-layer-shell.so.0 and would not start without it"
            exit 1
          fi
          # A log line of ggml-vulkan's own (ggml_vk_instance_init): if a
          # whisper.cpp update rewords it, this check fails on a good build.
          if ! grep -qa 'ggml_vulkan: No devices found' target/release/protocol; then
            echo "protocol has no ggml-vulkan: was it built with --features vulkan?"
            exit 1
          fi
          appimage_contents="$RUNNER_TEMP/appimage-contents.txt"
          offset=$("$appimage" --appimage-offset)
          unsquashfs -l -o "$offset" "$appimage" > "$appimage_contents"
          # Settings gives an AppImage's agents "$APPIMAGE" --mcp-server, which
          # execs this file (main.rs).
          grep -q '/usr/bin/protocol-mcp$' "$appimage_contents"
          # The system's Vulkan loader and drivers, never a bundled loader (#176).
          if grep -q 'libvulkan' "$appimage_contents"; then
            grep 'libvulkan' "$appimage_contents"
            echo "The AppImage carries a Vulkan loader"
            exit 1
          fi
          # The AppImage keeps the pinned ffmpeg next to the executable.
          grep -q '/usr/bin/ffmpeg$' "$appimage_contents"
          # The desktop file is named after the windows' app id and its
          # StartupWMClass repeats it, so desktops show the app's icon for its
          # window (#191); the app's own log below says which id it sets.
          desktop_entry="$RUNNER_TEMP/desktop-entry"
          # dpkg-deb -x creates only the last folder of its target.
          mkdir -p "$desktop_entry"
          dpkg-deb -x "$deb" "$desktop_entry/deb"
          unsquashfs -no-progress -o "$offset" -d "$desktop_entry/appimage" "$appimage" usr/share/applications usr/share/icons >/dev/null
          node scripts/release/check-linux-desktop-entry.mjs --root "$desktop_entry/deb" --root "$desktop_entry/appimage"
          # The player's GStreamer plugins, and AppRun pointing GStreamer at them.
          unsquashfs -no-progress -o "$offset" -d "$RUNNER_TEMP/appimage-hook" "$appimage" apprun-hooks >/dev/null
          node scripts/release/appimage-gstreamer.mjs check "$appimage_contents" \
            "$RUNNER_TEMP/appimage-hook/apprun-hooks/linuxdeploy-plugin-gstreamer.sh"
          mcp_version=$(APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --mcp-server --version)
          echo "$mcp_version"
          [[ "$mcp_version" == "protocol-mcp "* ]]
          # The bundled speaker models and their notices, as the macOS leg checks
          # them; without them Pyannote needs the repair download.
          for name in segmentation-3.0.onnx voxceleb_resnet34_LM.onnx xvec_transform.npz parakeet-rs-LICENSE.txt THIRD_PARTY_MODELS.txt; do
            if ! grep -q "/resources/diarization/$name\$" "$contents"; then
              echo "The deb lacks resources/diarization/$name"
              exit 1
            fi
            if ! grep -q "/resources/diarization/$name\$" "$appimage_contents"; then
              echo "The AppImage lacks resources/diarization/$name"
              exit 1
            fi
          done
          # The ONNX Runtime build/onnxruntime.rs stages; the app loads it by
          # absolute path from its resources, never from the system.
          for name in libonnxruntime.so onnxruntime-LICENSE.txt; do
            if ! grep -qF "/binaries/onnxruntime/$name" "$contents"; then
              echo "The deb lacks binaries/onnxruntime/$name"
              exit 1
            fi
            if ! grep -qF "/binaries/onnxruntime/$name" "$appimage_contents"; then
              echo "The AppImage lacks binaries/onnxruntime/$name"
              exit 1
            fi
          done

          log="$RUNNER_TEMP/protocol-launch.log"
          # Own session, so stopping it also stops Xvfb and the app's children.
          APPIMAGE_EXTRACT_AND_RUN=1 RUST_BACKTRACE=1 RUST_LOG=info setsid xvfb-run -a "$appimage" >"$log" 2>&1 &
          pid=$!
          sleep 30
          if ! kill -0 "$pid" >/dev/null 2>&1; then
            wait "$pid" || true
            cat "$log"
            echo "Protocol exited during startup."
            exit 1
          fi
          kill -TERM -- "-$pid" >/dev/null 2>&1 || true
          sleep 2
          kill -KILL -- "-$pid" >/dev/null 2>&1 || true
          wait "$pid" >/dev/null 2>&1 || true
          cat "$log"
          grep -q "Application setup complete" "$log"
          node scripts/release/check-linux-desktop-entry.mjs --log "$log"
          # The version build/onnxruntime.rs pins for Linux.
          if ! grep -q "Initialized verified bundled ONNX Runtime 1.24.4" "$log"; then
            echo "Protocol did not load its bundled ONNX Runtime 1.24.4"
            exit 1
          fi
          if ! grep -q "Fresh database initialized successfully" "$log"; then
            echo "::warning::The Linux WebView did not reach the database setup under xvfb"
          fi

          mkdir -p dist
          cp "$appimage" dist/protocol-linux-x86_64.AppImage
          cp "$deb" "dist/protocol_${VERSION}_amd64.deb"
          node scripts/release/write-sha256sums.mjs dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leg-linux
          path: |
            dist/protocol-linux-x86_64.AppImage
            dist/protocol_${{ inputs.version }}_amd64.deb
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: logs-linux
          path: ${{ runner.temp }}/protocol-launch.log
          if-no-files-found: ignore
          retention-days: 14
