name: OpenSSF Scorecard

# Scores the repository's supply-chain practices (pinned actions, token
# permissions, branch protection, code review, ...) and publishes the result to
# api.scorecard.dev, which serves the README badge; the SARIF goes to the
# Security tab. Publishing makes the Scorecard API check this file: no
# top-level env or defaults, no workflow-level write permissions, and only
# checkout, upload-artifact, upload-sarif and the Scorecard action in the job.
# Results are published only from the default branch, so pull requests do not
# run it.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Upload the SARIF to code scanning.
      security-events: write
      # Sign the published result with the workflow's OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
